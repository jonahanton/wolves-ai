name: Release

on:
  push:
    tags:
      - prod-*

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: wolves-engine
  TASK_FAMILY: wolves-engine-daily
  AGENT_TASK_FAMILY: wolves-engine-agent
  BACKEND_ECR_REPOSITORY: wolves-backend
  ECS_CLUSTER: wolves
  BACKEND_SERVICE: wolves-backend

jobs:
  deploy-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      # Schedules target families without revisions, so registering new
      # revisions is the whole engine deployment.
      - name: Register task definition revision pinned to this tag
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
        run: |
          for family in "$TASK_FAMILY" "$AGENT_TASK_FAMILY"; do
            aws ecs describe-task-definition --task-definition "$family" \
              --query taskDefinition > taskdef.json
            jq --arg image "$IMAGE" '
              .containerDefinitions[0].image = $image
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
            ' taskdef.json > new-taskdef.json
            aws ecs register-task-definition --cli-input-json file://new-taskdef.json \
              --query 'taskDefinition.{family: family, revision: revision}'
          done

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest

      # The service task definition points at :latest, so a forced deployment
      # pulls the image just pushed.
      - name: Roll the backend service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$BACKEND_SERVICE" \
            --force-new-deployment \
            --query 'service.{service: serviceName, status: status}'
