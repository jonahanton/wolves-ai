name: Tag release

# A merged PR carrying the `release` label tags the next prod patch on main,
# which fires release.yml. Unlabelled merges deploy nothing.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          # A PAT, not GITHUB_TOKEN: a tag pushed by GITHUB_TOKEN will not fire
          # release.yml (GitHub suppresses workflows from GITHUB_TOKEN events).
          token: ${{ secrets.RELEASE_TAG_PAT }}

      - id: version
        run: |
          latest=$(git tag --list 'prod-*' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            next="prod-0.1.0"
          else
            base=${latest#prod-}
            major=$(echo "$base" | cut -d. -f1)
            minor=$(echo "$base" | cut -d. -f2)
            patch=$(echo "$base" | cut -d. -f3)
            next="prod-${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=${next}" >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "$TAG"
