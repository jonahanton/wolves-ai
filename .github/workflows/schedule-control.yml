name: Schedule control

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: Enable the daily run schedule
        required: true
        type: boolean
      cron:
        description: New cron expression, UTC (blank keeps the current one)
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update the schedule via the backend admin API
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ENABLED: ${{ inputs.enabled }}
          CRON: ${{ inputs.cron }}
        run: |
          body=$(jq -n --argjson enabled "$ENABLED" --arg cron "$CRON" \
            '{enabled: $enabled} + (if $cron == "" then {} else {cron: $cron} end)')
          curl --fail-with-body -sS -X POST "$BACKEND_URL/admin/schedule" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body"
