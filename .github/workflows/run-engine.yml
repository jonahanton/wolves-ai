name: Run engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which engine command to run
        required: true
        default: agent
        type: choice
        options:
          - daily
          - agent
          - live
      ceiling_usd:
        description: Agent spend ceiling in USD (blank uses the engine default)
        required: false
        type: string
      force:
        description: Skip the active-task guard
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECS_CLUSTER: wolves
  TASK_FAMILY: wolves-engine-daily
  ARCHIVE_TASK_FAMILY: wolves-engine-archive

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_OPS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # PENDING tasks carry desiredStatus RUNNING, so one filter covers both.
      - name: Refuse to overlap an active engine task
        if: ${{ !inputs.force }}
        run: |
          for family in "$TASK_FAMILY" "$ARCHIVE_TASK_FAMILY"; do
            active=$(aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --family "$family" \
              --desired-status RUNNING \
              --query 'taskArns' --output text)
            if [ -n "$active" ] && [ "$active" != "None" ]; then
              echo "Engine task already active in family $family: $active" >&2
              echo "Re-run with force=true to launch anyway." >&2
              exit 1
            fi
          done

      - name: Run one engine task
        env:
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          MODE: ${{ inputs.mode }}
          CEILING_USD: ${{ inputs.ceiling_usd }}
        run: |
          case "$MODE" in
            daily) command='["wolves.run"]' ;;
            agent) command='["wolves.run_agent","--live","--confirm-spend"]' ;;
            live) command='["wolves.live","--loop","--interval","60"]' ;;
            *) echo "unknown mode: $MODE" >&2; exit 2 ;;
          esac
          if [ -n "$CEILING_USD" ] && [ "$MODE" != "agent" ]; then
            echo "ceiling_usd only applies to agent runs" >&2
            exit 2
          fi
          overrides=$(jq -n --argjson command "$command" '{
            containerOverrides: [{name: "engine", command: $command}]
          }')
          if [ -n "$CEILING_USD" ]; then
            overrides=$(jq --arg ceiling "$CEILING_USD" '
              .containerOverrides[0].environment = [{name: "AGENT_RUN_CEILING_USD", value: $ceiling}]
            ' <<<"$overrides")
          fi
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_FAMILY" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --overrides "$overrides" \
            --query 'tasks[0].taskArn'
