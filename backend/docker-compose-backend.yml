services:
  backend:
    container_name: "backend-${WORKSPACE_NAME:-wolves-ai}"
    restart: unless-stopped
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: development
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - BUCKET=${BUCKET:-}
      - STORAGE_DIR=/app/runs
      - STORAGE_MODE=${STORAGE_MODE:-local}
      - RUNS_ROOT=/app/runs
      - DYNAMO_ENDPOINT=http://db:8000
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - JOBS_ENABLED=${JOBS_ENABLED:-true}
    volumes:
      - ..:/app
      - /app/.venv
      - ${HOME}/.aws:/root/.aws
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
