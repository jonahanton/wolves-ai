[project]
name = "wolves-backend"
version = "0.1.0"
description = "The Wolves' World Cup Superforecaster API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wolves_backend"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# N803: fake boto3 clients mirror the PascalCase wire kwargs of the real SDK.
"tests/**" = ["N803"]

[tool.ruff.lint.isort]
known-first-party = ["wolves_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
