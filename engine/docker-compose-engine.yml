services:
  engine:
    container_name: "engine-${WORKSPACE_NAME:-wolves-ai}"
    build:
      context: ..
      dockerfile: engine/Dockerfile
      target: development
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - RUNS_ROOT=/app/runs
      - DYNAMO_ENDPOINT=http://db:8000
    volumes:
      - ..:/app
      - /app/.venv
    networks:
      - app-network
    restart: "no"
