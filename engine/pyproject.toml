[project]
name = "wolves"
version = "0.1.0"
description = "The Wolves' World Cup Superforecaster engine"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.96.0",
    "httpx[http2]>=0.28.0",
    "pydantic>=2.11.0",
    "pydantic-ai>=1.84.0,<1.98.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "duckdb>=1.1.0",
    "openpyxl>=3.1.0",
    "logfire>=3.0.0",
    "boto3>=1.35.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
    "moto[s3,dynamodb]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wolves"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
# N818: vendored exception names are part of the established API surface.
"wolves/connectors/_ssrf.py" = ["N818"]
"wolves/observability/runtime.py" = ["N818", "A002"]
# A002: `input` mirrors the tracer/observation vocabulary (input/output pairs).
"wolves/observability/tracer.py" = ["A002"]

[tool.ruff.lint.isort]
known-first-party = ["wolves"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: live integration smoke against real upstream APIs; opt-in via `pytest -m smoke`",
]
