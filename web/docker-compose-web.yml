services:
  web:
    container_name: "web-${WORKSPACE_NAME:-wolves-ai}"
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SNAPSHOT_DIR=/data/runs
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ../runs:/data/runs:ro
    networks:
      - app-network
